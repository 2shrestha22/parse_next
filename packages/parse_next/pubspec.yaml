name: parse_next
description: >-
  A type-safe Parse Server SDK for Dart and Flutter: generated models, typed
  queries and update ops, auth, cloud functions, batch, files and live queries.
version: 0.2.0
repository: https://github.com/2shrestha22/parse_next
resolution: workspace

topics:
  - parse-server
  - backend
  - database
  - codegen

environment:
  sdk: ^3.8.0

dependencies:
  http: ^1.6.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  async: ^2.11.0
  build_runner: ^2.10.0
  fake_async: ^1.3.3
  parse_next_generator: ^0.2.0
  test: ^1.26.0
