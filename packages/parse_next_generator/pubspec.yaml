name: parse_next_generator
description: >-
  The build_runner code generator for parse_next: typed fields, update ops and
  schemas for @ParseClass models, and clients for @ParseFunctions classes.
version: 0.3.0
repository: https://github.com/2shrestha22/parse_next
resolution: workspace

topics:
  - parse-server
  - codegen
  - build-runner

environment:
  sdk: ^3.8.0

dependencies:
  analyzer: ">=8.1.1 <15.0.0"
  build: ">=4.0.0 <6.0.0"
  parse_next: ^0.3.0
  source_gen: ^4.0.1

dev_dependencies:
  build_runner: ^2.10.0
  build_test: ^3.5.0
  test: ^1.26.0
