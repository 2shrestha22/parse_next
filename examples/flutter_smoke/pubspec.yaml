name: flutter_smoke
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  parse_next:
    path: ../../packages/parse_next

dev_dependencies:
  build_runner: ^2.10.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  http: ^1.6.0
  integration_test:
    sdk: flutter
  parse_next_generator:
    path: ../../packages/parse_next_generator

# Needed although parse_next is a path dependency: parse_next_generator asks
# for the hosted one, and the solver fails without this.
dependency_overrides:
  parse_next:
    path: ../../packages/parse_next
