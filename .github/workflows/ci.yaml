name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["3.8.0", stable]
        parse-server: ["9.10.5", "8.6.112"]
    env:
      PARSE_SERVER_VERSION: ${{ matrix.parse-server }}
      PUB_RESOLVE: ${{ matrix.sdk == '3.8.0' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: tool/ci.sh
