name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    # Not ubuntu-latest or ubuntu-24.04: their kernel makes Mongo 8 refuse to
    # start (SERVER-121912; SERVER-136848 misreads Ubuntu's 7.0.0 kernels).
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        parse-server: ["9.10.5", "8.6.112"]
    env:
      PARSE_SERVER_VERSION: ${{ matrix.parse-server }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: tool/ci.sh
